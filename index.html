<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity V 角色投票系統</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <div id="app">
    <div id="status-banner" class="status-banner hidden"></div>
    <!-- 登入畫面 -->
    <div id="login-view" class="view hidden">
      <div class="login-container">
        <div class="login-header">
          <h1>Identity V 角色投票系統</h1>
          <p>請使用 Google 帳號登入後開始投票。</p>
        </div>
        <div id="google-signin-button" class="google-signin"></div>
        <p class="login-hint">按下上方按鈕登入，查看角色排名與投票結果。</p>
      </div>
    </div>

    <!-- 首頁 -->
    <div id="home-view" class="view hidden">
      <header class="header">
        <h1>Identity V 角色投票系統</h1>
        <div class="user-info">
          <span id="user-name"></span>
          <button id="logout-btn" class="btn-logout">登出</button>
        </div>
      </header>

      <main class="main-content">
        <div class="categories">
          <button class="category-btn" data-camp="survivor">
            <span class="category-name">求生者</span>
          </button>
          <button class="category-btn" data-camp="hunter">
            <span class="category-name">監管者</span>
          </button>
        </div>

        <section class="leaderboard-preview">
          <h2>排行榜預覽</h2>
          <div class="tab-buttons">
            <button class="tab-btn active" data-tab="all-rank">全部排名</button>
            <button class="tab-btn" data-tab="survivor-rank">求生者</button>
            <button class="tab-btn" data-tab="hunter-rank">監管者</button>
          </div>
          <div id="leaderboard-container" class="leaderboard-list"></div>
          <a href="#leaderboard" class="view-all-btn">查看完整排行榜</a>
        </section>
      </main>

      <footer class="footer">
        <p>資料來源自官方遊戲內或官方發布內容。</p>
        <p>資料更新日期：<span id="data-update-date">2026 年 7 月 2 日</span></p>
      </footer>
    </div>

    <!-- 角色列表 -->
    <div id="character-list-view" class="view hidden">
      <header class="header">
        <button class="back-btn" data-back="home">返回</button>
        <h1 id="character-list-title">角色列表</h1>
        <div></div>
      </header>

      <main class="main-content">
        <div id="characters-grid" class="characters-grid"></div>
      </main>
    </div>

    <!-- 角色詳細 -->
    <div id="character-detail-view" class="view hidden">
      <header class="header">
        <button class="back-btn" data-back="character-list">返回</button>
        <h1 id="character-detail-title">角色詳細</h1>
        <div></div>
      </header>

      <main class="main-content">
        <div class="character-detail">
          <div class="character-image">
            <img id="character-img" src="" alt="角色照片">
          </div>
          <div class="character-info">
            <h2 id="detail-manor-name"></h2>
            <div class="info-grid">
              <div class="info-item">
                <label>名稱</label>
                <span id="detail-profession"></span>
              </div>
              <div class="info-item">
                <label>陣營</label>
                <span id="detail-camp"></span>
              </div>
              <div class="info-item">
                <label>得票數</label>
                <span id="detail-votes">0</span>
              </div>
              <div class="info-item">
                <label>排名</label>
                <span id="detail-rank">暫無排名</span>
              </div>
            </div>
            <button id="vote-btn" class="btn-primary btn-large">投票給此角色</button>
          </div>
        </div>
      </main>
    </div>

    <!-- 投票畫面 -->
    <div id="voting-view" class="view hidden">
      <header class="header">
        <button class="back-btn" data-back="character-detail">返回</button>
        <h1>開始投票</h1>
        <div></div>
      </header>

      <main class="main-content">
        <div class="voting-container">
          <div class="timer-container">
            <div class="timer" id="timer">60</div>
            <p class="timer-label">剩餘時間</p>
          </div>

          <div class="question-container">
            <h2 id="question-text"></h2>
            <div id="options-container" class="options"></div>
          </div>

          <div id="result-container" class="result-container hidden">
            <h2 id="result-title"></h2>
            <p id="result-message"></p>
            <div id="result-detail"></div>
            <button id="next-btn" class="btn-primary btn-large">下一題</button>
          </div>
        </div>
      </main>
    </div>

    <!-- 冷卻畫面 -->
    <div id="cooldown-view" class="view hidden">
      <header class="header">
        <button class="back-btn" data-back="character-detail">返回</button>
        <h1>冷卻時間</h1>
        <div></div>
      </header>

      <main class="main-content">
        <div class="cooldown-container">
          <div class="cooldown-icon">⏳</div>
          <h2 id="cooldown-title"></h2>
          <p id="cooldown-message"></p>
          <div class="cooldown-timer">
            <div id="cooldown-remaining"></div>
          </div>
          <button class="btn-primary btn-large" id="cooldown-done-btn">返回主畫面</button>
        </div>
      </main>
    </div>

    <!-- 排行榜頁面 -->
    <div id="leaderboard-view" class="view hidden">
      <header class="header">
        <button class="back-btn" data-back="home">返回</button>
        <h1>排行榜</h1>
        <div></div>
      </header>

      <main class="main-content">
        <div class="leaderboard-tabs">
          <button class="leaderboard-tab-btn active" data-rank-type="all">所有角色</button>
          <button class="leaderboard-tab-btn" data-rank-type="survivor">求生者</button>
          <button class="leaderboard-tab-btn" data-rank-type="hunter">監管者</button>
        </div>
        <div id="full-leaderboard" class="full-leaderboard"></div>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/character-image-map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
